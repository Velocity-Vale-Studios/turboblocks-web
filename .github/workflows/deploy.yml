name: Deploy Turboblocks to VPS

# Robot odpala się tylko, gdy robisz "push" na gałąź master
on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Łączenie z serwerem i aktualizacja
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          # To są komendy, które robot wpisze za Ciebie w konsoli:
          script: |
            # 1. Wejdź tam, gdzie jest kod i repozytorium GIT
                            cd /webpage/frontend
            
            # 2. Pobierz realnie nowe pliki z GitHub
                            git fetch origin master
                            git reset --hard origin/master
            
            # 3. Zamiast kopiować pliki "wyżej", odpalimy Dockera bezpośrednio stąd, 
            # wskazując mu plik compose, który jest piętro wyżej
                            sudo docker compose -f ../docker-compose.yml down
            
            # 4. KLUCZ: Budujemy frontend, wymuszając brak cache
            # Upewnij się, że w docker-compose.yml ścieżka do buildu frontendu to "." lub "./frontend"
                            sudo docker compose -f ../docker-compose.yml build --no-cache
            
            # 5. Start wszystkiego
                            sudo docker compose -f ../docker-compose.yml up -d
            
            # 6. Czyszczenie śmieci (opcjonalnie, by nie zapchać VPS)
                            sudo docker image prune -f