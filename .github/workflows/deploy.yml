name: Deploy Turboblocks to VPS

# Robot odpala się tylko, gdy robisz "push" na gałąź master
on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Łączenie z serwerem i aktualizacja
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          # To są komendy, które robot wpisze za Ciebie w konsoli:
          script: |
            # --- FRONTEND (turboblocks-web) ---
            git config --global --add safe.directory /webpage/frontend
            cd /webpage/frontend
            sudo git fetch origin master
            sudo git reset --hard origin/master
            
            # --- BACKEND ---
            cd /webpage
            if [ ! -d "Backend" ]; then
              sudo git clone https://github.com/Velocity-Vale-Studios/Backend.git Backend
            fi
            git config --global --add safe.directory /webpage/Backend
            cd /webpage/Backend
            sudo git fetch origin main || sudo git fetch origin master
            sudo git reset --hard origin/main || sudo git reset --hard origin/master
            
            # --- DASHBOARD ---
            cd /webpage
            if [ ! -d "Dashboard" ]; then
              sudo git clone https://github.com/Velocity-Vale-Studios/Dashboard.git Dashboard
            fi
            git config --global --add safe.directory /webpage/Dashboard
            cd /webpage/Dashboard
            sudo git fetch origin main || sudo git fetch origin master
            sudo git reset --hard origin/main || sudo git reset --hard origin/master
            
            # --- DOCKER ---
            cd /webpage/frontend
            sudo docker compose -f docker-compose.yml build
            sudo docker compose -f docker-compose.yml up -d
            sudo docker ps