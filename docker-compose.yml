version: '3.8'

services:
  frontend:
    build: ./frontend
    container_name: turboblocks-web
    expose:
      - "4321"
    restart: always

  caddy:
    image: caddy:latest
    container_name: turboblocks-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config: