version: '3.8'

services:
  mariadb:
    image: mariadb:latest
    container_name: turboblocks-db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: turboblocks
      MARIADB_USER: turboblocks
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql

  backend:
    build: ../Backend
    container_name: turboblocks-backend
    restart: always
    depends_on:
      - mariadb
    expose:
      - "8000"
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_USER=turboblocks
      - DB_PASSWORD=${MARIADB_PASSWORD}
      - DB_DATABASE=turboblocks
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_ORIGINS=http://localhost,http://dashboard.localhost
      # - DISCORD_CLIENT_ID=...
      # - DISCORD_CLIENT_SECRET=...
      # - DISCORD_REDIRECT_URI=...

  frontend:
    build: .
    container_name: turboblocks-web
    restart: always
    expose:
      - "4321"
    environment:
      - PUBLIC_API_URL=http://api.localhost

  dashboard:
    build: ../Dashboard
    container_name: turboblocks-dashboard
    restart: always
    expose:
      - "4321"
    environment:
      - PUBLIC_API_URL=http://api.localhost

  caddy:
    image: caddy:latest
    container_name: turboblocks-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - dashboard
      - backend
    networks:
      default:
        aliases:
          - api.localhost

volumes:
  caddy_data:
  caddy_config:
  mariadb_data: